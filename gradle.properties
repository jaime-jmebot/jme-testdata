POM_SCM_CONNECTION=scm:git:git://github.com/jMonkeyEngine/jme3-testdata.git
POM_SCM_DEVELOPER_CONNECTION=scm:git:git@github.com:jMonkeyEngine/jme3-testdata.git
POM_LICENSE_NAME=New BSD (3-clause) License
